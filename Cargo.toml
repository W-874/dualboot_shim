[workspace]
resolver = "3"
members = ["guest-entry", "crates/skyward-block", "crates/skyward-sys"]
exclude = ["tools/skyward-package-check"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
libc = "0.2.175"
anyhow = "1.0.100"
hex = "0.4.3"
serde ={ version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[profile.release]
opt-level = "z"
# Optimizing across crates at link time does it at the binary's level,
# for size, over the UI's own.
lto = false
codegen-units = 1
panic = "abort"
strip = true
